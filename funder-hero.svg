<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0E1A"/>
      <stop offset="1" stop-color="#151C31"/>
    </linearGradient>
    <linearGradient id="word" x1="80" y1="120" x2="520" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#A99BFF"/>
    </linearGradient>
    <linearGradient id="track" x1="780" y1="300" x2="1120" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B7CFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#34D9B5" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="90" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B7CFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8B7CFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34D9B5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#34D9B5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="0" fill="url(#bg)"/>
  <circle cx="1010" cy="120" r="230" fill="url(#glow)" opacity="0.5"/>

  <!-- Milestone growth motif (right) -->
  <path d="M780 300 L860 250 L940 210 L1020 150 L1100 95 L1100 320 L780 320 Z" fill="url(#area)"/>
  <path d="M780 300 L860 250 L940 210 L1020 150 L1100 95" stroke="url(#track)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g>
    <circle cx="780" cy="300" r="7" fill="#8B7CFF"/>
    <circle cx="860" cy="250" r="7" fill="#8B7CFF"/>
    <circle cx="940" cy="210" r="7" fill="#9C8FFF"/>
    <circle cx="1020" cy="150" r="7" fill="#B7ADFF"/>
    <circle cx="1100" cy="95" r="16" fill="#34D9B5" fill-opacity="0.18"/>
    <circle cx="1100" cy="95" r="9" fill="#34D9B5"/>
  </g>

  <!-- Wordmark -->
  <text x="78" y="168" font-size="92" font-weight="800" fill="url(#word)" letter-spacing="-2">Funder</text>

  <!-- Tagline -->
  <text x="82" y="216" font-size="27" font-weight="500" fill="#AEB8D4">Startup funding, milestone by milestone.</text>

  <!-- Feature chips -->
  <g font-size="16" font-weight="600" fill="#D7DEF2">
    <g>
      <rect x="80" y="250" width="178" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="169" y="275" text-anchor="middle">Milestone escrow</text>
    </g>
    <g>
      <rect x="270" y="250" width="196" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="368" y="275" text-anchor="middle">Native e-signature</text>
    </g>
    <g>
      <rect x="478" y="250" width="210" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="583" y="275" text-anchor="middle">Real-time deal rooms</text>
    </g>
  </g>

  <!-- Bilingual chip + URL -->
  <g>
    <rect x="80" y="302" width="150" height="34" rx="17" fill="#34D9B5" fill-opacity="0.12" stroke="#34D9B5" stroke-opacity="0.35"/>
    <text x="155" y="324" text-anchor="middle" font-size="15" font-weight="600" fill="#7BE8CE">Bilingual EN / AR</text>
  </g>
  <circle cx="250" cy="319" r="3" fill="#5B6480"/>
  <text x="266" y="324" font-size="15" font-weight="500" fill="#8792AD">funder-delta.vercel.app</text>
</svg>
